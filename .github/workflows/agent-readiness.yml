name: Agent Readiness

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  audit-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Audit educational examples
        run: |
          mkdir -p reports
          codex-study audit examples/python-basics --format markdown --output reports/python-basics.md
          codex-study audit examples/cpp-basics --format markdown --output reports/cpp-basics.md
      - name: Comment audit summary on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const marker = "<!-- codex-study-audit -->";
            const reportDir = "reports";
            const reports = fs
              .readdirSync(reportDir)
              .filter((file) => file.endsWith(".md"))
              .sort()
              .map((file) => {
                const name = file.replace(/\.md$/, "");
                const body = fs.readFileSync(path.join(reportDir, file), "utf8").trim();
                return `### ${name}\n\n${body}`;
              })
              .join("\n\n");

            const body = `${marker}\n## Codex Study Audit\n\n${reports}\n\n_Updated by Agent Readiness workflow._`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(
              (comment) => comment.user.type === "Bot" && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: agent-readiness-reports
          path: reports/*.md
