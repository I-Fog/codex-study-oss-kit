[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-study-oss-kit"
version = "0.1.0"
description = "CLI toolkit for agent-ready educational OSS repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "I-Fog" }
]
keywords = ["codex", "education", "open-source", "agents", "teaching"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.scripts]
codex-study = "codex_study_oss_kit.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_study_oss_kit = [
  "templates/scaffold/base/*.tmpl",
  "templates/scaffold/python/*.tmpl"
]
